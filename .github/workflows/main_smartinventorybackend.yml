name: Build and deploy JAR app to Azure Web App - smartinventorybackend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: smartinventorybackend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_18D97C49A1814741A56F82D58A39016D }}
          package: target/*.jar
