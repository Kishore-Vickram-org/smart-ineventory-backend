server:
  port: ${PORT:${WEBSITES_PORT:8080}}

spring:
  application:
    name: harbor-inventory

  datasource:
    # If Azure/App Service provides SPRING_DATASOURCE_URL, it will be used.
    # Otherwise the app safely falls back to an in-memory H2 database.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:true}
    open-in-view: false

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  cors:
    # Default: allow any origin. For production, restrict this to exact origins:
    # app.cors.allowed-origins:
    #   - "https://your-frontend.example"
    allowed-origin-patterns:
      - "*"
